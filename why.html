<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Why: Staff CPD</title>
<link rel="manifest" href="manifest-why.webmanifest">
<link rel="icon" href="icon-cpd-192.png"><link rel="apple-touch-icon" href="icon-cpd-touch.png">
<meta name="theme-color" content="#16294F">
<style>
:root{--navy:#16294F;--ink:#1d2433;--mute:#5b6577;--line:#dde1e8;--bg:#f4f5f8;--ok:#1f7a4d;--okbg:#e6f4ec;--bad:#b3261e;--badbg:#fbeae9;--acc:#2f5bd6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:6px 10px;font-size:14px}
main{max-width:680px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.tile{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:16px;color:var(--ink);cursor:pointer}
.tile:hover{border-color:var(--navy)}
.tile small{color:var(--mute);font-size:13px;white-space:nowrap}
button{font:inherit;cursor:pointer}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.muted{color:var(--mute);font-size:14px}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:12px;margin:12px 0 4px;color:var(--mute);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.back{background:none;border:0;color:var(--acc);padding:0;margin-bottom:10px;font-size:15px}
input[type=text],input[type=search]{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px}
.flip{min-height:200px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.flip .big{font-size:20px;font-weight:500}
.flip ul{margin:6px 0 0;padding-left:20px}.flip li{margin-bottom:6px}
.bar{height:5px;background:#e6e9ef;border-radius:3px;margin:8px 0 14px}.bar i{display:block;height:5px;background:var(--navy);border-radius:3px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:15px;color:var(--ink);line-height:1.4}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.fb{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.fb ul{margin:4px 0 0;padding-left:20px}
.verdict{font-weight:600}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.score{font-size:40px;font-weight:600;text-align:center;margin:4px 0}
.tag{display:inline-block;font-size:12px;background:#e8edf9;color:var(--navy);padding:2px 9px;border-radius:8px}
.hit{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.hit:last-child{border:0}
.modal{position:fixed;inset:0;background:rgba(10,18,36,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{max-width:360px;width:100%}
</style></head><body>
<header><h1 id="ttl">The Why</h1><button id="hbtn" style="display:none">Home</button></header>
<main id="app"></main>
<script>
var G=null,SC=[],S=function(k){try{return localStorage.getItem(k)}catch(e){return null}},W=function(k,v){try{localStorage.setItem(k,v)}catch(e){}};
var app=document.getElementById('app'),hb=document.getElementById('hbtn');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function cap(s){s=s.trim();return s.charAt(0).toUpperCase()+s.slice(1)}
function sent(s){s=cap(s);return /[.!?)]$/.test(s)?s:s+'.'}
function weLine(s){s=s.trim();var low=/^[A-Z]{2}/.test(s)?s:s.charAt(0).toLowerCase()+s.slice(1);return 'We '+low.replace(/\.$/,'')}
function all(){var o=[];G.chapters.forEach(function(ch){ch.cards.forEach(function(c){o.push({ch:ch,c:c})})});return o}
function findCard(ref){var ch=G.chapters.filter(function(x){return x.id===ref.chapter})[0];if(!ch)return null;var c=ch.cards.filter(function(x){return x.we===ref.we})[0];return c?{ch:ch,c:c}:null}
function soList(c){return '<ul>'+c.so.map(function(s){return '<li>'+esc(sent(s))+'</li>'}).join('')+'</ul>'}
function head(t,home){document.getElementById('ttl').textContent=t;hb.style.display=home?'none':'block'}
hb.onclick=function(){home()};

function askName(force){
  if(S('why_name')&&!force)return;
  var m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="card"><h2>Welcome</h2><p class="muted">What is your first name? It is only used to greet you and stays on this device.</p><input type="text" id="nm" placeholder="First name" autocomplete="given-name" maxlength="30"><p id="ner" class="muted" style="color:var(--bad);display:none;margin:6px 0 0">Enter your first name</p><div style="margin-top:12px"><button class="btn" id="nok" style="width:100%">Continue</button></div></div>';
  document.body.appendChild(m);
  var inp=m.querySelector('#nm');if(force)inp.value=S('why_name')||'';
  function go(){var v=inp.value.trim().split(/\s+/)[0];if(!v){m.querySelector('#ner').style.display='block';return}W('why_name',v);m.remove();home()}
  m.querySelector('#nok').onclick=go;inp.onkeydown=function(e){if(e.key==='Enter')go()};
}

function home(){
  head('The Why',true);
  var n=S('why_name');
  var h='<h2>'+(n?'Hello, '+esc(n):'Hello')+'</h2><p class="muted">Practise how and why we do what we do at Mossbourne. Pick a chapter.</p>';
  h+='<input type="search" id="q" placeholder="Search the guide" style="margin:12px 0">';
  h+='<div id="res"></div><div id="list">';
  G.chapters.forEach(function(ch,i){var sc=SC.filter(function(s){return s.chapter===ch.id}).length;h+='<button class="tile" data-i="'+i+'"><span>'+ch.chapter+'. '+esc(ch.title)+'</span><small>'+ch.cards.length+' cards'+(sc?', '+sc+' scenarios':'')+'</small></button>'});
  h+='</div><p class="muted" style="text-align:center;margin-top:18px"><button class="back" id="chn">Change name</button></p>';
  app.innerHTML=h;
  app.querySelectorAll('.tile').forEach(function(b){b.onclick=function(){chapter(+b.dataset.i)}});
  document.getElementById('chn').onclick=function(){askName(true)};
  var q=document.getElementById('q');
  q.oninput=function(){
    var t=q.value.trim().toLowerCase(),r=document.getElementById('res'),l=document.getElementById('list');
    if(t.length<3){r.innerHTML='';l.style.display='';return}
    l.style.display='none';
    var hits=all().filter(function(x){return (x.c.we+' '+x.c.so.join(' ')).toLowerCase().indexOf(t)>-1}).slice(0,25);
    r.innerHTML=hits.length?hits.map(function(x,i){return '<div class="hit" data-i="'+i+'"><span class="tag">'+esc(x.ch.title)+'</span><div>'+esc(weLine(x.c.we))+'</div></div>'}).join(''):'<p class="muted">No matches.</p>';
    r.querySelectorAll('.hit').forEach(function(d){d.onclick=function(){var x=hits[+d.dataset.i];single(x)}});
  };
}
function single(x){
  head(x.ch.title,false);
  app.innerHTML='<button class="back" id="bk">Back</button><div class="card"><div class="big" style="font-size:19px;font-weight:500">'+esc(weLine(x.c.we))+'</div><h3>So that</h3>'+soList(x.c)+'</div>';
  document.getElementById('bk').onclick=home;
}

function chapter(i){
  var ch=G.chapters[i];head(ch.title,false);
  var sc=SC.filter(function(s){return s.chapter===ch.id});
  app.innerHTML='<button class="back" id="bk">All chapters</button><h2>'+ch.chapter+'. '+esc(ch.title)+'</h2>'+
  '<button class="tile" id="m1"><span>Flip cards</span><small>'+ch.cards.length+' cards</small></button>'+
  '<button class="tile" id="m2"><span>Match the reason</span><small>10 questions</small></button>'+
  (sc.length?'<button class="tile" id="m3"><span>Scenarios</span><small>'+sc.length+'</small></button>':'<p class="muted">No scenarios for this chapter yet.</p>');
  document.getElementById('bk').onclick=home;
  document.getElementById('m1').onclick=function(){cards(i)};
  document.getElementById('m2').onclick=function(){match(i)};
  if(sc.length)document.getElementById('m3').onclick=function(){scen(i)};
}

function cards(i,order,pos,shown){
  var ch=G.chapters[i];order=order||ch.cards.map(function(_,k){return k});pos=pos||0;
  var c=ch.cards[order[pos]],back=!!shown;
  head(ch.title,false);
  app.innerHTML='<button class="back" id="bk">'+esc(ch.title)+'</button><div class="muted">'+(pos+1)+' of '+order.length+'</div><div class="bar"><i style="width:'+((pos+1)/order.length*100)+'%"></i></div>'+
  '<div class="card flip" id="fc">'+(back?'<h3 style="margin-top:0">So that</h3>'+soList(c):'<div class="big">'+esc(weLine(c.we))+'</div><p class="muted" style="margin-top:14px">Tap to see why</p>')+'</div>'+
  '<div class="row"><button class="btn alt" id="pv">Previous</button><button class="btn alt" id="sh">Shuffle</button><button class="btn" id="nx">Next</button></div>';
  document.getElementById('bk').onclick=function(){chapter(i)};
  document.getElementById('fc').onclick=function(){cards(i,order,pos,!back)};
  document.getElementById('pv').onclick=function(){cards(i,order,(pos-1+order.length)%order.length)};
  document.getElementById('nx').onclick=function(){cards(i,order,(pos+1)%order.length)};
  document.getElementById('sh').onclick=function(){cards(i,shuf(order),0)};
}

function quiz(title,items,back,again){
  var q=0,miss=[],right=0;
  function show(){
    if(q>=items.length)return end();
    var it=items[q];head(title,false);
    app.innerHTML='<button class="back" id="bk">Quit</button><div class="muted">'+(q+1)+' of '+items.length+'</div><div class="bar"><i style="width:'+((q+1)/items.length*100)+'%"></i></div><div class="card"><div style="font-size:17px;font-weight:500">'+esc(it.q)+'</div></div><div id="opts"></div><div id="fb"></div>';
    document.getElementById('bk').onclick=back;
    var o=document.getElementById('opts');
    it.opts.forEach(function(t,k){var b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=function(){pick(k)};o.appendChild(b)});
    function pick(k){
      var ok=k===it.ans;if(ok)right++;else miss.push(it);
      o.querySelectorAll('.opt').forEach(function(b,j){b.disabled=true;if(j===it.ans)b.classList.add('ok');else if(j===k)b.classList.add('no')});
      document.getElementById('fb').innerHTML='<div class="card fb" style="border-top:0"><div class="verdict '+(ok?'ok':'no')+'">'+(ok?'Right':'Not quite')+'</div><h3>What we do</h3><div>'+esc(weLine(it.card.we))+'</div><h3>So that</h3>'+soList(it.card)+'<div style="margin-top:12px"><button class="btn" id="nx" style="width:100%">'+(q+1>=items.length?'See results':'Next')+'</button></div></div>';
      document.getElementById('nx').onclick=function(){q++;show()};
    }
  }
  function end(){
    head(title,false);
    var h='<div class="card"><p class="muted" style="text-align:center;margin:0">Set complete</p><div class="score">'+right+' of '+items.length+'</div></div>';
    if(miss.length){h+='<h3>Worth another look</h3>';miss.forEach(function(it){h+='<div class="card"><div style="font-weight:500">'+esc(it.q)+'</div><h3>What we do</h3><div>'+esc(weLine(it.card.we))+'</div><h3>So that</h3>'+soList(it.card)+'</div>'})}
    h+='<div class="row">'+(miss.length?'<button class="btn" id="rt">Retry missed</button>':'')+'<button class="btn alt" id="ag">New set</button><button class="btn alt" id="bk">Back</button></div>';
    app.innerHTML=h;
    if(miss.length)document.getElementById('rt').onclick=function(){quiz(title,shuf(miss.map(function(m){return m})),back,again)};
    document.getElementById('ag').onclick=again;document.getElementById('bk').onclick=back;
  }
  show();
}

function match(i){
  var ch=G.chapters[i],pool=ch.cards.length>=5?ch.cards:all().map(function(x){return x.c});
  var items=shuf(ch.cards).slice(0,10).map(function(c){
    var right=sent(shuf(c.so)[0]);var mine=c.so.map(sent);
    var d=[];shuf(pool).forEach(function(o){if(o===c||d.length>=3)return;var t=sent(shuf(o.so)[0]);if(mine.indexOf(t)>-1||d.indexOf(t)>-1||t===right)return;d.push(t)});
    var opts=shuf([right].concat(d));
    return {q:'Which of these is why we '+weLine(c.we).slice(3)+'?',opts:opts,ans:opts.indexOf(right),card:c};
  });
  quiz(ch.title+': match the reason',items,function(){chapter(i)},function(){match(i)});
}

function scen(i){
  var ch=G.chapters[i];
  var items=shuf(SC.filter(function(s){return s.chapter===ch.id})).map(function(s){
    var order=shuf(s.options.map(function(_,k){return k}));var opts=order.map(function(k){return s.options[k]});
    var f=findCard(s.ref);return {q:s.q,opts:opts,ans:order.indexOf(s.answer),card:f?f.c:{we:s.ref.we,so:[]}};
  });
  quiz(ch.title+': scenarios',items,function(){chapter(i)},function(){scen(i)});
}

Promise.all([fetch('data/guide.json').then(function(r){if(!r.ok)throw 0;return r.json()}),fetch('data/scenarios.json').then(function(r){return r.ok?r.json():{scenarios:[]}}).catch(function(){return {scenarios:[]}})]).then(function(a){
  G=a[0];SC=a[1].scenarios||[];if(S('why_name'))home();else{home();askName()}
}).catch(function(){app.innerHTML='<div class="card">Could not load data/guide.json. Check that it is in the data folder of the repository.</div>'});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script></body></html>
