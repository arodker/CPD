<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Why: Staff CPD</title>
<style>
:root{--ink:#1d2433;--mut:#5d6677;--line:#dde1e8;--bg:#f7f7f4;--card:#fff;--soft:#eef0f4;--navy:#14284b;--acc:#1f6f8b;--accbg:#e3f1f6;--ok:#17653a;--okbg:#e2f3e8;--bad:#9b1c1c;--badbg:#fbe6e6;--amb:#8a5a00;--ambbg:#fdf1d6}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:var(--navy);color:#fff}
header b{font-size:19px}header span{opacity:.7;margin-left:8px;font-size:14px}
.who{font-size:13px;opacity:.9}.who a{color:#fff;margin-left:8px}
nav{display:flex;gap:2px;padding:0 10px;background:#fff;border-bottom:1px solid var(--line)}
nav a{padding:11px 12px;text-decoration:none;color:var(--mut);border-bottom:3px solid transparent;font-weight:600;font-size:15px}
nav a.on{color:var(--navy);border-color:var(--navy)}
main,.center{max-width:640px;margin:0 auto;padding:18px 16px 70px}.center{padding-top:50px}
h1{font-size:26px;line-height:1.25;margin:0 0 6px;color:var(--navy)}h2{font-size:18px;margin:26px 0 8px;color:var(--navy)}
.lead{color:var(--mut);margin:0 0 14px}.muted{color:var(--mut);font-size:14px}.lnk{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.ghost,.btn.ghost{background:#fff;color:var(--navy)}
button:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--mut);white-space:nowrap}
.tag.go{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--ambbg);color:var(--amb)}
.banner{background:var(--ambbg);color:var(--amb);border-radius:10px;padding:8px 12px;font-size:14px;margin:10px 0}
.unit{display:flex;gap:14px;align-items:center}
.unit .em{font-size:34px}.unit .grow{flex:1;min-width:0}
.ring{width:62px;height:62px;flex:none}
.xp{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.xp b{font-size:20px;color:var(--navy)}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--acc);border-radius:8px;transition:width .3s}
.stmt{font-size:18px;line-height:2.15;margin:4px 0}
.we{font-weight:700;color:var(--navy)}
ul.so{list-style:none;padding:0;margin:6px 0 0}
ul.so li{font-size:16px;line-height:2.1;padding:6px 0 6px 0;border-top:1px solid var(--line)}
ul.so li:first-child{border-top:0}
.sol{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--acc);margin:14px 0 0}
input.gap{font:inherit;font-weight:600;border:0;border-bottom:2px solid var(--acc);background:var(--accbg);border-radius:6px 6px 0 0;padding:1px 6px;margin:0 2px;color:var(--ink);text-align:center;min-width:3.2ch;max-width:100%}
input.gap:focus{outline:2px solid var(--acc);outline-offset:1px}
input.gap.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
input.gap.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
input.gap.rev{border-color:var(--amb);background:var(--ambbg);color:var(--amb)}
.slot{display:inline-block;max-width:100%;vertical-align:baseline;text-align:center;cursor:pointer;font-weight:600;padding:1px 8px;margin:0 2px;border-bottom:2px solid var(--acc);background:var(--accbg);border-radius:6px 6px 0 0;color:#7a8aa0;letter-spacing:.14em;font-size:15px;line-height:1.8;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.slot.filled{color:var(--ink);letter-spacing:0;font-size:inherit}.slot.sel{outline:2px solid var(--acc);outline-offset:1px;background:#cfe7f0}.slot.drop{outline:2px dashed var(--acc);background:#cfe7f0}
.slot.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}.slot.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}.slot.rev{border-color:var(--amb);background:var(--ambbg);color:var(--amb)}
.dn{font-weight:600;color:var(--ok)}.pillw{margin:2px 0 10px}.pill{display:inline-flex;background:#eef1f5;border:1px solid #d5dbe3;border-radius:999px;padding:3px}.pill button{border:0;background:transparent;color:var(--mut);border-radius:999px;padding:8px 20px;min-height:40px;font-size:14px;font-weight:600;cursor:pointer}.pill button.on{background:var(--navy);color:#fff}
.chip{min-height:40px;line-height:26px}.chip.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
input.gap::placeholder{color:#7a8aa0;letter-spacing:.14em;font-weight:400;font-size:15px}input.gap.drop{outline:2px dashed var(--acc);background:#cfe7f0}
.bank{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;max-height:30vh;overflow:auto;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.chip{display:inline-block;margin:4px 4px 4px 0;padding:6px 12px;border:1.5px solid var(--acc);background:var(--accbg);color:var(--navy);border-radius:99px;font-weight:600;font-size:15px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.chip.used{opacity:.35;cursor:default}.chip.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-130%);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.msg{border-radius:10px;padding:10px 12px;margin-top:12px;font-size:15px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.rev{background:var(--ambbg);color:var(--amb)}.msg.hint{background:var(--soft);color:var(--mut)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:#fff;color:var(--ink);border:1.5px solid var(--line);font-weight:500;font-size:17px;padding:13px 14px}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.q{font-size:19px;line-height:1.6;margin:6px 0 4px}
.blank{display:inline-block;min-width:4.5ch;border-bottom:3px solid var(--acc);color:transparent;vertical-align:baseline}
.ctx{font-size:14px;color:var(--mut);margin:0 0 10px}
.score{font-size:46px;font-weight:700;color:var(--navy);line-height:1.1}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:9px 6px;border-top:1px solid var(--line)}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);border-top:0}td.n,th.n{text-align:right}
tr.me td{background:var(--accbg);font-weight:700}
label{display:block;font-weight:600;margin:14px 0 4px}input.t,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 6px}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}input.gap.bad{animation:shake .25s}
.rushcard{background:linear-gradient(135deg,#14284b,#1f6f8b);color:#fff;border:0;border-radius:14px;padding:16px;margin:0 0 14px}
.rushcard h2{color:#fff;margin:0 0 4px;font-size:20px}.rushcard p{margin:0 0 10px;color:#d7e6ee;font-size:14px}
.rushcard .btn{background:#fff;color:var(--navy);display:inline-block}
.rushcard.lock{background:var(--soft);color:var(--ink)}.rushcard.lock h2{color:var(--navy)}.rushcard.lock p{color:var(--mut)}
.rtag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;background:rgba(255,255,255,.18);border-radius:99px;padding:3px 10px;margin-bottom:8px}
.arena{background:#14284b;color:#fff;border-radius:16px;padding:14px;margin-top:8px}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hearts{font-size:20px;letter-spacing:3px;color:#ff6b6b}.hearts i{font-style:normal;color:#4a5b7d}
.rscore{font-weight:700;font-size:18px}
.combo{display:inline-block;border-radius:99px;padding:3px 12px;font-weight:700;font-size:14px;background:#2d4572;color:#cfe0ff;transition:all .2s}
.combo.m2{background:#e0a100;color:#2b1d00}.combo.m3{background:#f26b21;color:#fff}.combo.m4{background:#d6246e;color:#fff;transform:scale(1.08)}
.rtime{height:10px;background:#2d4572;border-radius:8px;overflow:hidden;margin:10px 0 4px}.rtime i{display:block;height:100%;background:#5ad1a0;border-radius:8px;transition:width .1s linear}.rtime.low i{background:#ff6b6b}
.rtsec{text-align:right;font-size:12px;color:#b9c8e6}
.rq{background:#fff;color:var(--ink);border-radius:12px;padding:14px;margin:8px 0 12px;font-size:16px;line-height:1.7}
.rq .rw{color:var(--mut);font-size:14px}.rgap{display:inline-block;min-width:7ch;border-bottom:2px solid var(--acc);background:var(--accbg);border-radius:6px 6px 0 0;text-align:center;color:#7a8aa0}
.ropts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ropt{min-height:56px;border-radius:12px;border:2px solid #3f5a8c;background:#1c3763;color:#fff;font-size:16px;font-weight:600;padding:8px;cursor:pointer;transition:transform .1s}
.ropt:active{transform:scale(.97)}.ropt.ok{background:#1f8a54;border-color:#5ad1a0}.ropt.bad{background:#a42b2b;border-color:#ff8f8f}.ropt.off{opacity:.3}
.rfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:#b9c8e6;min-height:36px}
.r5050{background:transparent;color:#fff;border:2px solid #5ad1a0;border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer}.r5050[disabled]{opacity:.35}
.pop{animation:pop .35s}.shake{animation:shake .4s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.stars{font-size:38px;letter-spacing:6px;color:#f5c542;text-align:center;margin:6px 0}.stars i{font-style:normal;color:#4a5b7d}
.rbig{margin-top:14px;font-size:56px;font-weight:800;text-align:center;line-height:1.1}.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.rstat{background:#1c3763;border-radius:10px;padding:10px;text-align:center}.rstat b{display:block;font-size:20px}.rstat span{font-size:12px;color:#b9c8e6}
.slot.glow{animation:glow 1s ease-in-out infinite;border-color:var(--navy)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(31,111,139,.0);background:var(--accbg)}50%{box-shadow:0 0 0 5px rgba(31,111,139,.35);background:#cfe7f0}}
</style>
</head>
<body>
<div id="top"></div>
<div id="app"></div>
<script>
/* ===== Settings ===== */
const CONFIG={
  endpoint:'',                 // Apps Script web app address for the shared league (see README). Empty = demo mode on this device only
  quizOpenDays:7,              // a quiz is open this many days from its quiz date
  graceDays:2,                 // and still counts for this many days after that
  pointsPerCorrect:10,         // league points per correct quiz answer
  xpPerBlank:2,                // flashcards: XP for each word typed correctly (once per word per day)
  xpPerCard:10,                // flashcards: bonus the first time a whole card is right with no Show me
  teams:['English','Maths','Science','MFL','Humanities','Art & Tech','Performing Arts','PE','CSD','Support Staff','TAs'],
  levels:[[0,'Getting started'],[150,'Learning the ropes'],[400,'Confident'],[800,'Secure'],[1300,'Expert'],[1500,'Champion']]
};
/* ===== Units: one per fortnight. Words in {{double braces}} are the missing words. Text is taken word for word from The Why 2026 V9 ===== */
let UNITS=[],DEC={};

/* ===== Helpers ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P_=new URLSearchParams(location.search);
const PREVIEW=P_.has('preview');
const LIVE=!!CONFIG.endpoint&&!PREVIEW&&!P_.has('date');
const DAY=864e5;
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const today=()=>{const d=P_.get('date');const t=d?new Date(d+'T12:00:00'):new Date();t.setHours(12,0,0,0);return t};
const dt=s=>new Date(s+'T12:00:00');
const fmt=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const key=n=>String(n).trim().toLowerCase().replace(/\s+/g,' ');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]/g,'');
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
const right=(v,ans)=>{const a=norm(v),b=norm(ans);if(!a)return false;return a===b||(b.length>=5&&a.length>=4&&lev(a,b)<=1)};
const plain=t=>t.replace(/\{\{(.+?)\}\}/g,'$1');
const blanks=t=>[...t.matchAll(/\{\{(.+?)\}\}/g)].map(m=>m[1]);
const MODE=()=>ls.get('cpdMode')||'tap';
const unitById=id=>UNITS.find(u=>u.id===id);

/* ===== State, personal progress ===== */
let S={user:ls.get('cpdUser'),rows:[],err:'',drill:null,quiz:null,content:'loading',cerr:''};
const PK=()=>'cpdProg_'+key(S.user.name);
const prog=()=>ls.get(PK())||{xp:0,known:{},daily:{}};
const saveProg=p=>ls.set(PK(),p);
const dayKey=()=>today().toISOString().slice(0,10);

/* ===== Dates and status ===== */
function drillOpen(u){return PREVIEW||today()>=dt(u.drill)}
function qStatus(u){if(PREVIEW)return'open';const t=today(),o=dt(u.quiz),c=new Date(o.getTime()+CONFIG.quizOpenDays*DAY),g=new Date(c.getTime()+CONFIG.graceDays*DAY);if(t<o)return'upcoming';if(t<c)return'open';if(t<g)return'grace';return'closed'}
const counts=u=>{const s=qStatus(u);return s==='open'||s==='grace'};

/* ===== Score store (Google Apps Script or demo) ===== */
function seedDemo(){const r=[];let k=7;for(let i=0;i<14;i++){k=(k*37+11)%101;r.push({name:'Sample colleague '+(i+1),team:CONFIG.teams[i%6],quizId:'u1',score:5+(k%6),max:10,date:'2026-12-04T10:00:00.000Z'})}return r}
const Store={
  async load(){if(!LIVE)return seedDemo().concat(ls.get('cpdDemoRows')||[]);const r=await fetch(CONFIG.endpoint);if(!r.ok)throw new Error('Could not load the league');const j=await r.json();return j.map(x=>({name:String(x.name||''),team:String(x.team||''),quizId:String(x.quizId),score:+x.score,max:+x.max,date:x.date}))},
  async save(row){if(!LIVE){const m=ls.get('cpdDemoRows')||[];m.push(row);ls.set('cpdDemoRows',m);return}const r=await fetch(CONFIG.endpoint,{method:'POST',body:JSON.stringify(row)});if(!r.ok)throw new Error('Could not save your score')}
};
const clean=rows=>{const m=new Map();rows.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(r=>{const k=key(r.name)+'|'+r.quizId;if(!m.has(k))m.set(k,r)});return[...m.values()]};
const myRows=()=>clean(S.rows).filter(r=>key(r.name)===key(S.user.name));
const myRow=id=>myRows().find(r=>r.quizId===id);
function totals(){const by=new Map();clean(S.rows).forEach(r=>{const k=key(r.name);const u=by.get(k)||{k,name:r.name,team:r.team,pts:0,n:0,last:0};u.pts+=r.score*CONFIG.pointsPerCorrect;u.n++;if(new Date(r.date)>=u.last){u.last=new Date(r.date);u.team=r.team||u.team}by.set(k,u)});return[...by.values()]}
function league(){const by={};totals().forEach(u=>{const t=u.team||'Other';(by[t]=by[t]||{name:t,pts:0,n:0}).pts+=u.pts;by[t].n++});const L=Object.values(by).map(t=>({...t,avg:Math.round(t.pts/t.n*10)/10}));L.sort((a,b)=>b.avg-a.avg||a.name.localeCompare(b.name));let p=0,prev=null;L.forEach((x,i)=>{if(x.avg!==prev){p=i+1;prev=x.avg}x.rank=p});return L}

/* ===== XP ===== */
function xpTotal(){const quiz=myRows().reduce((a,r)=>a+r.score*CONFIG.pointsPerCorrect,0);return prog().xp+quiz}
function level(x){let i=0;CONFIG.levels.forEach((l,k)=>{if(x>=l[0])i=k});const cur=CONFIG.levels[i],nxt=CONFIG.levels[i+1];return{name:cur[1],next:nxt?nxt[1]:null,pct:nxt?Math.round((x-cur[0])/(nxt[0]-cur[0])*100):100,need:nxt?nxt[0]-x:0}}
function xpCard(){const x=xpTotal(),l=level(x);return`<div class="card"><div class="xp"><div><div class="muted">Your level</div><b>${esc(l.name)}</b></div><div style="text-align:right"><div class="muted">XP</div><b>${x}</b></div></div><div class="bar"><i style="width:${l.pct}%"></i></div><div class="muted">${l.next?l.need+' XP to '+esc(l.next):'Top level reached'}</div></div>`}
function mastery(u){const k=prog().known;return u.cards.filter((c,i)=>k[u.id+':'+i]).length}
function ring(p){const c=2*Math.PI*24,d=p/100*c;return`<svg class="ring" viewBox="0 0 60 60"><circle cx="30" cy="30" r="24" fill="none" stroke="#e5e8ee" stroke-width="7"/><circle cx="30" cy="30" r="24" fill="none" stroke="var(--acc)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${d} ${c}" transform="rotate(-90 30 30)"/><text x="30" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2433">${p}%</text></svg>`}

/* ===== Views ===== */
function head(){return`<header><div><b>The Why</b><span>Staff CPD</span></div>${S.user?`<div class="who">${esc(S.user.name)} · ${esc(S.user.team)}<a href="#profile">Change</a></div>`:''}</header>`}
function nav(v){const t=[['home','Home'],['board','Team league']];return`<nav>${t.map(x=>`<a href="#${x[0]}" class="${v===x[0]?'on':''}">${x[1]}</a>`).join('')}</nav>`}
const banner=()=>PREVIEW?'<div class="banner">Preview mode: everything is open and scores stay on this device.</div>':(P_.has('date')?'<div class="banner">Test date: '+fmt(today())+'. Scores stay on this device.</div>':(!LIVE?'<div class="banner">Demo mode: the league shows sample colleagues and your scores stay on this device.</div>':''));

function phase(u){
  const t=today(),d=dt(u.drill),q=dt(u.quiz);
  if(PREVIEW)return{tag:'Preview',cls:'warn',line:'Everything is open for testing.'};
  if(t<d)return{tag:'Opens '+fmt(d),cls:'',line:'Drill week starts '+fmt(d)+'. Quiz opens '+fmt(q)+'.'};
  if(t<q)return{tag:'Drill week',cls:'go',line:'This week: 5 minutes of flashcards at your team meeting. The quiz opens '+fmt(q)+'.'};
  const s=qStatus(u);
  if(s==='open'||s==='grace')return{tag:s==='open'?'Quiz open':'Last chance',cls:'go',line:'This week: take the 10 question quiz. It counts for your team until '+fmt(new Date(q.getTime()+(CONFIG.quizOpenDays+CONFIG.graceDays-1)*DAY))+'.'};
  return{tag:'Closed',cls:'',line:'The league quiz has closed. You can still practise.'};
}
function unitCard(u){
  const ph=phase(u),m=mastery(u),p=Math.round(m/u.cards.length*100),r=myRow(u.id),dOpen=drillOpen(u),qs=qStatus(u),qOpen=qs!=='upcoming';
  return`<div class="card"><div class="unit"><div class="em">${u.emoji}</div><div class="grow"><div class="muted">${esc(u.chap)}</div><h2 style="margin:0">${esc(u.title)}</h2><span class="tag ${ph.cls}">${esc(ph.tag)}</span></div>${ring(p)}</div>
  <p class="muted" style="margin:10px 0 0">${esc(ph.line)}</p>
  <p class="muted" style="margin:4px 0 0">${m} of ${u.cards.length} cards known${r?` · Quiz score ${r.score}/${r.max}`:''}</p>
  <div class="btns">${dOpen?`<a class="btn" href="#drill/${u.id}">Flashcards</a>`:`<button disabled>Flashcards</button>`}${qOpen||PREVIEW?`<a class="btn ghost" href="#quiz/${u.id}">${r?'Practise the quiz':'Take the quiz'}</a>`:`<button class="ghost" disabled>Quiz</button>`}</div></div>`;
}

function startDrill(id){const u=unitById(id);if(!u||!drillOpen(u)){location.hash='home';return}S.drill={u,queue:shuffle(u.cards.map((c,i)=>i)),i:0,rev:false,again:0,xp:0,mastered:0,done:false,cardDone:false,reqd:{},stage:0,usedBank:false,msg:''}}

  ${D.cardDone?'':`<div class="pillw"><div class="pill" id="mode" role="group" aria-label="Answer mode"><button data-m="tap" class="${MODE()==='tap'?'on':''}">Match</button><button data-m="type" class="${MODE()==='tap'?'':'on'}">Type</button></div></div>`}
  <div class="card" id="card"><div class="stmt"><span class="we">We</span> ${st===0?stmtHTML(c.we,ci,'w'):doneHTML(c.we)}</div>${st>=1?`<span class="sol">so that</span><ul class="so">${c.so.slice(0,st).map((s,j)=>`<li>${(j===st-1&&!D.cardDone)?stmtHTML(s,ci,'s'+j):doneHTML(s)}</li>`).join('')}</ul>`:''}<div id="fb"></div></div>

function bindDrill(){
  const D=S.drill;if(!D||D.done)return;
  const tap=MODE()==='tap';
  const fields=[...document.querySelectorAll('.gap')];
  const isIn=e=>e.tagName==='INPUT',val=e=>isIn(e)?e.value:(e.dataset.v||''),locked=e=>e.dataset.lock==='1';
  const setv=(e,v)=>{if(isIn(e))e.value=v;else{e.dataset.v=v;e.textContent=v||e.dataset.p;e.classList.toggle('filled',!!v)}};
  const lock=e=>{e.dataset.lock='1';if(isIn(e))e.readOnly=true};
  document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{if(b.dataset.m!==(tap?'tap':'type')){ls.set('cpdMode',b.dataset.m);render()}});
  if(D.msg)$('#fb').innerHTML=D.msg;
  const fb=m=>{$('#fb').innerHTML=m};const lastSt=D.u.cards[D.queue[D.i]].so.length;
  function award(f){const p=prog(),k=D.u.id+':'+f.dataset.f,d=dayKey(),x=(tap||D.usedBank)?1:CONFIG.xpPerBlank;p.daily=p.daily||{};if(p.daily[k]!==d){p.daily[k]=d;p.xp+=x;D.xp+=x;saveProg(p)}}
  function finish(clean){
    D.cardDone=true;const ci=D.queue[D.i],id=D.u.id+':'+ci,p=prog(),assisted=!tap&&D.usedBank;$('#bank').innerHTML='';const mk2=$('#mode');if(mk2)mk2.parentNode.remove();
    if(clean&&!assisted){if(!p.known[id]){p.known[id]=1;p.xp+=CONFIG.xpPerCard;D.xp+=CONFIG.xpPerCard}D.mastered++;saveProg(p);fb('<div class="msg ok">All correct. Card known.</div>')}
    else{if(D.rev){delete p.known[id];saveProg(p)}if(!D.reqd[ci]){D.reqd[ci]=1;D.queue.push(ci)}fb(D.rev?'<div class="msg rev">Read it through once more. This card will come back at the end.</div>':'<div class="msg rev">All correct, but you used the options, so this card is not marked as known yet. It will come back at the end to try without them.</div>')}
    $('#acts').innerHTML=`<button id="nxt">${D.i+1>=D.queue.length?'Finish':'Next card'}</button>`;bind2();
  }
  function check(){
    let any=false;
    fields.forEach(f=>{if(locked(f))return;const v=val(f).trim();if(!v){f.classList.remove('bad');return}any=true;if(right(v,f.dataset.a)){f.classList.remove('bad','sel');f.classList.add('ok');setv(f,f.dataset.a);lock(f);award(f)}else{f.classList.remove('ok');f.classList.add('bad');void f.offsetWidth}});
    sync();
    const left=fields.filter(f=>!locked(f)).length;
    if(left===0){advance();return}
    fb(tap?`<div class="msg hint">${left} still to get. Tap a red word to send it back, then pick another. Or tap Show me.</div>`:`<div class="msg hint">${left} still to get. Fix the red ones, fill any empty gaps, or tap Show options or Show me.</div>`);
    if(!tap){const f=fields.find(i=>!locked(i)&&(i.classList.contains('bad')||!val(i).trim()));if(f&&!any)f.focus()}
  }
  function advance(){if((D.stage||0)<lastSt){D.stage=(D.stage||0)+1;D.msg='<div class="msg ok">Correct. Now the next "so that".</div>';render()}else finish(!D.rev)}
  if(!D.cardDone&&!fields.length)setTimeout(()=>{if(S.drill===D&&!D.cardDone&&!document.querySelector('.gap'))advance()},700);
  function show(){D.rev=true;fields.forEach(f=>{if(!locked(f)){setv(f,f.dataset.a);lock(f);f.classList.remove('bad','sel');f.classList.add('rev')}});if((D.stage||0)<lastSt){fb('<div class="msg rev">Here they are. This card will come back at the end.</div>');$('#bank').innerHTML='';$('#acts').innerHTML='<button id="cont">Next part</button>';$('#cont').onclick=()=>{D.stage=(D.stage||0)+1;D.msg='';render()};const m=$('#mode');if(m)m.parentNode.remove();const ci=D.queue[D.i];if(!D.reqd[ci]){D.reqd[ci]=1;D.queue.push(ci)}const p=prog();delete p.known[D.u.id+':'+ci];saveProg(p)}else finish(false)}
  function bind2(){const n=$('#nxt');if(n)n.onclick=()=>{D.i++;D.cardDone=false;D.rev=false;D.stage=0;D.usedBank=false;D.msg='';if(D.i>=D.queue.length)D.done=true;render()}}
  function bankWords(){const ans=fields.map(i=>i.dataset.a),mine=new Set(ans.map(norm)),cd=D.u.cards[D.queue[D.i]];
    const uniq=a=>a.filter((w,k)=>!mine.has(norm(w))&&a.findIndex(x=>norm(x)===norm(w))===k);
    const cap=(w,a)=>/^[A-Z]/.test(a)?w.charAt(0).toUpperCase()+w.slice(1):w;
    const lists=ans.map(a=>shuffle((DEC[norm(a)]||[]).filter(w=>!mine.has(norm(w)))).map(w=>cap(w,a)));
    const out=[];for(let r=0;r<2&&out.length<2;r++)lists.forEach(l=>{if(out.length<2&&l[r]&&!out.some(o=>norm(o)===norm(l[r])))out.push(l[r])});
    if(out.length<2){const pool=shuffle(uniq([].concat(...D.u.cards.map(c=>blanks(c.we).concat(...c.so.map(blanks))))));while(out.length<2&&pool.length)out.push(pool.shift())}

  function sync(){const chips=[...document.querySelectorAll('.chip')];chips.forEach(c=>c.classList.remove('used'));
    fields.forEach(i=>{const v=norm(val(i));if(!v)return;const c=chips.find(c=>!c.classList.contains('used')&&norm(c.dataset.w)===v);if(c)c.classList.add('used')})}
  let selChip=null,selSlot=null;
  const clearSel=()=>{document.querySelectorAll('.glow').forEach(x=>x.classList.remove('glow'));if(selChip)selChip.classList.remove('sel');if(selSlot)selSlot.classList.remove('sel');selChip=selSlot=null};

    const under=ev=>{const el=document.elementFromPoint(ev.clientX,ev.clientY);const t=el&&el.closest&&el.closest('.gap');return t&&!locked(t)?t:null};
    const mv=ev=>{if(!g&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){g=ch.cloneNode(true);g.classList.add('ghost');document.body.appendChild(g);clearSel()}
      if(g){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';const u=under(ev);if(over&&over!==u)over.classList.remove('drop');over=u;if(u)u.classList.add('drop')}};
    const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
      if(over)over.classList.remove('drop');if(g){g.remove();place(under(ev),ch.dataset.w)}else tapChip(ch)};
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)}))}
  function bank(){const cap=tap?'Tap a word, then tap the gap it belongs in (or tap a gap first). Tap a filled gap to take the word back. Two of these words do not belong on this card.':'Drag a word into a gap, or tap a word to fill the gap you are on. Two of these words do not belong on this card.';
    $('#bank').innerHTML='<div class="bank"><div class="muted">'+cap+'</div>'+bankWords().map(w=>`<span class="chip" data-w="${esc(w)}">${esc(w)}</span>`).join('')+'</div>';wire();sync()}
  function options(){D.usedBank=true;$('#opt').hidden=true;bank()}
  const c=$('#chk');if(c)c.onclick=check;const o=$('#opt');if(o)o.onclick=options;const s=$('#shw');if(s)s.onclick=show;bind2();
  if(!tap&&D.usedBank&&!D.cardDone&&$('#opt')){$('#opt').hidden=true;bank()}
  if(tap){fields.forEach(f=>f.addEventListener('click',()=>tapSlot(f)));if(!D.cardDone)bank()}
  else{fields.forEach((inp,k)=>{inp.addEventListener('input',()=>{sync();tryLock(inp)});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const nx=fields.slice(k+1).find(i=>!locked(i));if(nx)nx.focus();else check()}})});

/* ===== Recall Rush ===== */
const RUSH={secs:60,lives:3,dailyXp:50,unlock:3};
const knownCount=()=>Object.keys(prog().known||{}).filter(k=>unitById(k.split(':')[0])).length;
function rushPool(){const p=prog(),out=[];Object.keys(p.known||{}).forEach(k=>{const [uid,ci]=k.split(':'),u=unitById(uid);if(!u)return;const c=u.cards[+ci];if(!c)return;const plain=x=>x.replace(/\{\{(.+?)\}\}/g,'$1');c.so.forEach(s=>{blanks(s).forEach((a,b)=>out.push({we:plain(c.we),so:s,a,b,uid,ci:+ci}))})});return out}
function rushLine(s,b){let n=0;return s.split(/(\{\{.+?\}\})/).map(p=>{const m=p.match(/^\{\{(.+)\}\}$/);if(!m)return esc(p);return n++===b?'<span class="rgap">______</span>':esc(m[1])}).join('')}
function rushOpts(it,all){const ans=it.a,u=unitById(it.uid),c=u.cards[it.ci],cap=w=>/^[A-Z]/.test(ans)?w.charAt(0).toUpperCase()+w.slice(1):w;
  const out=[];const add=w=>{if(w&&norm(w)!==norm(ans)&&!out.some(o=>norm(o)===norm(w)))out.push(w)};
  shuffle((DEC[norm(ans)]||[]).slice()).forEach(w=>add(cap(w)));
  shuffle(blanks(c.we).concat(...c.so.map(blanks))).forEach(add);
  shuffle(all.map(x=>x.a)).forEach(add);
  return shuffle([ans].concat(out.slice(0,3)))}
function startRush(){const pool=rushPool();if(pool.length<1||knownCount()<RUSH.unlock){location.hash='home';return}
  const items=shuffle(pool.slice());let q=items.slice();while(q.length<60)q=q.concat(shuffle(pool.slice()));
  S.rush={items:q,all:pool,qi:0,t:RUSH.secs*1000,lives:RUSH.lives,combo:0,bestCombo:0,correct:0,wrong:0,score:0,xp:0,fifty:true,hide:[],phase:'q',picked:null,newBest:false,capped:false,tid:null};S.rush.opts=rushOpts(q[0],pool)}
function stopRush(){if(S.rush&&S.rush.tid){clearInterval(S.rush.tid);S.rush.tid=null}}
const rushMult=c=>1+Math.min(3,Math.floor(c/3));
function rushView(){const R=S.rush;if(!R)return'';
  if(R.phase==='end'){const p=prog().rush||{};
    return`<main><a class="lnk" href="#home">Home</a><div class="arena"><div class="rtag" style="background:#2d4572;color:#cfe0ff">ROUND OVER</div><div class="rbig">${R.score}</div><div style="text-align:center;color:#b9c8e6;margin-top:2px">${R.newBest?'New high score':'High score '+(p.best||0)}</div>
    <div class="rgrid"><div class="rstat"><b>${R.correct}</b><span>Right</span></div><div class="rstat"><b>x${rushMult(R.bestCombo)}</b><span>Best multiplier</span></div><div class="rstat"><b>${R.bestCombo}</b><span>Longest streak</span></div><div class="rstat"><b>+${R.xp}</b><span>XP earned</span></div></div>
    ${R.capped?'<div class="rfoot" style="justify-content:center">You have reached today\'s '+RUSH.dailyXp+' XP limit. You can still play for score.</div>':''}
    <div class="btns"><button id="again" style="background:#fff;color:var(--navy)">Play again</button><a class="btn" href="#home" style="background:transparent;color:#fff;border:2px solid #fff">Home</a></div></div></main>`}
  const it=R.items[R.qi],m=rushMult(R.combo),secs=Math.ceil(R.t/1000);
  return`<main><a class="lnk" href="#home">Home</a><div class="arena"><div class="rtop"><div class="hearts" id="rh">${'♥'.repeat(R.lives)}<i>${'♥'.repeat(RUSH.lives-R.lives)}</i></div><span class="combo m${m}" id="rc">${R.combo>=3?'Streak '+R.combo+' · x'+m:'x1'}</span><div class="rscore" id="rs">${R.score}</div></div>
  <div class="rtime ${secs<=10?'low':''}" id="rtm"><i id="rtb" style="width:${Math.max(0,R.t/(RUSH.secs*10))}%"></i></div><div class="rtsec" id="rts">${secs}s</div>
  <div class="rq" id="rq"><div class="rw"><b>We</b> ${esc(it.we)}</div><div class="rw" style="margin:6px 0 2px;letter-spacing:.08em;font-size:12px;font-weight:700;color:var(--acc)">SO THAT</div>${rushLine(it.so,it.b)}</div>
  <div class="ropts">${R.opts.map((o,k)=>{let cl='ropt';if(R.hide.includes(k))cl+=' off';if(R.phase==='fb'){if(norm(o)===norm(it.a))cl+=' ok';else if(R.picked===k)cl+=' bad'}return`<button class="${cl}" data-k="${k}" ${(R.phase==='fb'||R.hide.includes(k))?'disabled':''}>${esc(o)}</button>`}).join('')}</div>
  <div class="rfoot"><button class="r5050" id="r50" ${(!R.fifty||R.phase==='fb')?'disabled':''}>50:50</button><span id="rm">${R.phase==='fb'?(R.picked!==null&&norm(R.opts[R.picked])===norm(it.a)?'Right':'Not quite'):'Tap the missing word'}</span></div></div></main>`}
function bindRush(){const R=S.rush;if(!R)return;
  const again=$('#again');if(again)again.onclick=()=>{startRush();render()};
  if(R.phase==='end')return;
  if(!R.tid){R.tid=setInterval(()=>{if(!S.rush||S.rush!==R||R.phase==='end'){clearInterval(R.tid);return}R.t-=100;const s=Math.ceil(Math.max(0,R.t)/1000),b=$('#rtb'),t=$('#rts'),m=$('#rtm');if(b)b.style.width=Math.max(0,R.t/(RUSH.secs*10))+'%';if(t)t.textContent=s+'s';if(m)m.classList.toggle('low',s<=10);if(R.t<=0)endRush()},100)}
  document.querySelectorAll('.ropt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  const f=$('#r50');if(f)f.onclick=()=>{if(!R.fifty||R.phase!=='q')return;const it=R.items[R.qi],wrong=R.opts.map((o,k)=>k).filter(k=>norm(R.opts[k])!==norm(it.a));R.fifty=false;R.hide=shuffle(wrong).slice(0,2);render()}}
function endRush(){const R=S.rush;if(!R||R.phase==='end')return;stopRush();R.phase='end';const p=prog();p.rush=p.rush||{};if(R.score>(p.rush.best||0)){if(p.rush.best)R.newBest=true;p.rush.best=R.score}saveProg(p);render()}
function answer(k){const R=S.rush;if(!R||R.phase!=='q')return;const it=R.items[R.qi],ok=norm(R.opts[k])===norm(it.a);R.picked=k;R.phase='fb';
  if(ok){R.correct++;R.combo++;R.bestCombo=Math.max(R.bestCombo,R.combo);const m=rushMult(R.combo);R.score+=10*m;R.t=Math.min(RUSH.secs*1000,R.t+3000);
    const p=prog();p.rush=p.rush||{};const d=dayKey();if(p.rush.d!==d){p.rush.d=d;p.rush.xp=0}const room=Math.max(0,RUSH.dailyXp-(p.rush.xp||0)),g=Math.min(m,room);if(g<m)R.capped=true;if(g>0){p.rush.xp=(p.rush.xp||0)+g;p.xp+=g;R.xp+=g}saveProg(p)}
  else{R.wrong++;R.combo=0;R.lives--}
  render();const q=$('#rq');if(q)q.classList.add(ok?'pop':'shake');
  setTimeout(()=>{if(S.rush!==R||R.phase==='end')return;if(R.lives<=0||R.t<=0){endRush();return}R.qi++;R.phase='q';R.picked=null;R.hide=[];R.opts=rushOpts(R.items[R.qi],R.all);render()},ok?550:1100)}
function rushCard(){const n=knownCount(),p=prog().rush||{},today=p.d===dayKey()?(p.xp||0):0;
  if(n<RUSH.unlock)return`<div class="rushcard lock"><div class="rtag" style="background:#dde1e8;color:var(--mut)">LOCKED</div><h2>Recall Rush</h2><p>Mark ${RUSH.unlock} flashcards as known to unlock a 60 second speed round. You have ${n} so far.</p><div class="bar"><i style="width:${Math.round(n/RUSH.unlock*100)}%"></i></div></div>`;
  return`<div class="rushcard"><div class="rtag">SPEED ROUND</div><h2>Recall Rush</h2><p>60 seconds on the cards you already know. Each right answer wins 3 seconds back. Build a streak, lift your multiplier, and keep your three lives.</p><p style="margin-bottom:12px">${n} card${n===1?'':'s'} in play · High score ${p.best||0} · XP today ${Math.min(today,RUSH.dailyXp)} of ${RUSH.dailyXp}</p><a class="btn" href="#rush">Play now</a></div>`}


/* ===== Content: the guide text lives in units.json, next to this page ===== */
async function loadContent(){
  try{const r=await fetch('data/units.json?v='+Date.now());if(!r.ok)throw new Error('missing');const d=await r.json();
    UNITS=d.units;DEC={};Object.keys(d.dec||{}).forEach(k=>DEC[k.toLowerCase().replace(/[^a-z0-9]/g,'')]=d.dec[k]);S.content='ready';S.cerr=''}
  catch(e){S.content='error';S.cerr='The content file data/units.json could not be loaded. Check that it is uploaded in the data folder and that the JSON is valid.'}
}
function gate(){return S.content==='error'?`<div class="center"><h1>Content not found</h1><p class="lead">${esc(S.cerr)}</p><div class="btns"><button id="rl">Try again</button></div></div>`:`<div class="center"><p class="lead">Loading…</p></div>`}
function bindGate(){const b=$('#rl');if(b)b.onclick=async()=>{S.content='loading';render();await loadContent();route();if(S.content==='ready'&&S.user)load()}}

/* ===== Router ===== */
function render(){
  const v=(location.hash||'#home').slice(1).split('/')[0];
  if(!S.user||v==='profile'){$('#app').innerHTML=head()+signin(!!S.user);const nm=$('#nm');if(nm&&!S.user)nm.focus();
    $('#go').onclick=()=>{const n=$('#nm').value.trim();if(n.length<2){$('#er').textContent='Please type your name.';return}S.user={name:n,team:$('#tm').value};ls.set('cpdUser',S.user);location.hash='#home';load()};return}
  if(S.content!=='ready'){$('#app').innerHTML=head()+gate();bindGate();return}
  let body='';
  if(v==='rush'&&S.rush){body=rushView()}else if(v==='drill'&&S.drill){body=drill()}else if(v==='quiz'&&S.quiz){body=quiz()}else if(v==='board'){body=board()}else body=home();
  $('#app').innerHTML=head()+nav(v==='board'?'board':'home')+body;
  if(v==='drill')bindDrill();if(v==='quiz')bindQuiz();if(v==='rush')bindRush();
}
function route(){
  const h=(location.hash||'#home').slice(1).split('/');
  if(S.user&&S.content==='ready'){if(h[0]==='drill'&&(!S.drill||S.drill.u.id!==h[1]||S.drill.done))startDrill(h[1]);if(h[0]==='quiz'&&(!S.quiz||S.quiz.u.id!==h[1]))startQuiz(h[1]);if(h[0]==='rush'&&!S.rush)startRush()}
  if(h[0]!=='rush'){stopRush();S.rush=null}
  if(h[0]!=='drill')S.drill=null;if(h[0]!=='quiz')S.quiz=null;
  render();window.scrollTo(0,0);
}
async function load(){try{S.rows=await Store.load();S.err=''}catch(e){S.err=e.message;S.rows=[]}route()}
window.addEventListener('hashchange',route);
(async()=>{route();await loadContent();route();if(S.user&&S.content==='ready')load()})();
</script>
